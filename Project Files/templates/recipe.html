<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{TITLE}} · {{SITE_NAME}}</title>
<meta name="description" content="{{DESCRIPTION_ATTR}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@300..800&amp;display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f8f7f4;--ink:#252923;--muted:#757870;--line:#e5e5df;--soft:#efefe9;
  --accent:#865c42;--accent-bg:#f3eae1;--white:#fff;--font:"Google Sans Flex",-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-optical-sizing:auto;-webkit-font-smoothing:antialiased}
button,input{font:inherit}
button:focus-visible,input:focus-visible{outline:3px solid #b58567;outline-offset:3px}
.site{max-width:1280px;padding:0 clamp(20px,5.4vw,70px) 100px;margin:auto}
.masthead{height:89px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px;font-size:15px;font-weight:690;letter-spacing:-.027em}
.brand-mark{display:grid;grid-template-columns:repeat(2,7px);gap:3px;transform:rotate(-14deg)}
.brand-mark i{width:7px;height:7px;background:#8c7059;border-radius:2.5px;display:block}
.print{border:1px solid #dadbd5;border-radius:999px;background:transparent;display:flex;align-items:center;gap:9px;padding:10px 17px;color:#555a52;font-size:13px;font-weight:600;cursor:pointer;transition:.2s}
.print:hover{background:#ecebe5;border-color:#c7c9c0}
.print svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7}
.intro{padding:60px 0 64px;display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:clamp(30px,6vw,94px);align-items:center}
.intro-copy{padding:8px 0;}
.intro--no-image{grid-template-columns:minmax(0,1fr)}
.kicker{display:flex;gap:12px;align-items:center;text-transform:uppercase;letter-spacing:.17em;font-weight:720;color:var(--accent);font-size:11px}
.kicker:before{content:"";width:21px;height:1px;background:var(--accent)}
h1{font-size:clamp(46px,5.45vw,78px);font-weight:680;line-height:1.035;letter-spacing:-.068em;margin:26px 0 22px;max-width:590px}
.summary{font-size:clamp(16px,1.4vw,18px);color:#73756f;line-height:1.68;max-width:470px;margin:0}
.yield{display:inline-flex;align-items:center;gap:11px;margin-top:30px;font-size:13px;color:#5f635b;font-weight:560}
.yield svg{width:18px;height:18px;stroke:var(--accent);stroke-width:1.6;fill:none}
.yield strong{color:#2b302a;font-weight:700}
.image-wrap{margin:0;min-width:0}
.hero{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:23px;box-shadow:0 22px 40px rgba(38,32,19,.065);background:#ece6da}
.time-meta{display:flex;flex-wrap:wrap;gap:12px 20px;margin-top:17px;color:#757870;font-size:12px}.time-meta strong{color:#454a44;font-weight:680}
.image-wrap figcaption{font-size:11px;color:#9b9d96;text-align:right;padding:13px 2px 0;line-height:1.4}
.recipe-section{border-top:1px solid var(--line);padding-top:63px;display:grid;grid-template-columns:minmax(235px,.8fr) minmax(0,1.3fr);gap:clamp(45px,8vw,118px)}
.section-title{font-size:26px;line-height:1.1;letter-spacing:-.05em;font-weight:670;margin:0}
.section-sub{font-size:13px;line-height:1.5;color:#8a8d84;margin:12px 0 30px}
.ingredients{list-style:none;padding:0;margin:0}
.ingredient{border-bottom:1px solid #e8e7e0}
.ingredient-group{list-style:none;margin:15px 0 0;color:#865c42;font-size:12px;font-weight:720;text-transform:uppercase;letter-spacing:.12em}
.ingredient label{display:flex;align-items:flex-start;gap:13px;padding:15px 0;cursor:pointer;color:#464b44;font-size:15px;line-height:1.52}
.ingredient input{appearance:none;width:19px;height:19px;flex:0 0 19px;border-radius:6px;border:1.5px solid #c1c4ba;cursor:pointer;margin:2px 0 0;position:relative;background:#fff}
.ingredient input:checked{background:var(--accent);border-color:var(--accent)}
.ingredient input:checked:before{content:"";position:absolute;width:8px;height:4px;border:2px solid white;border-top:0;border-right:0;transform:rotate(-45deg);left:4px;top:5px}
.ingredient input:checked + span{color:#a0a39c;text-decoration:line-through;text-decoration-thickness:1px}
.step-list{margin:0;padding:0;list-style:none;counter-reset:step}
.step{display:grid;grid-template-columns:44px 1fr;gap:20px;position:relative;padding-bottom:34px}
.step:not(:last-child):after{content:"";position:absolute;left:21px;top:48px;bottom:12px;border-left:1px solid #e2e0d7}
.step-number{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border:1px solid #e3dfd6;border-radius:50%;color:#987762;font-size:14px;font-weight:700;background:#f2efe9}
.step p{margin:2px 0 0;color:#3c413a;font-size:16px;line-height:1.78;max-width:590px}
.variations{margin-top:90px;padding-top:57px;border-top:1px solid var(--line)}
.variation-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
.variation-head p{font-size:13px;color:#898c84;margin:0 0 2px}
.variation-grid{margin-top:28px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.variation{background:#f1f0eb;border:1px solid #e9e8e2;border-radius:17px;padding:29px 30px 27px;min-height:174px}
.variation .eyebrow{color:#987962;text-transform:uppercase;font-size:10px;font-weight:750;letter-spacing:.15em;margin:0 0 16px}
.variation h3{font-size:17px;font-weight:690;letter-spacing:-.03em;margin:0 0 11px}
.variation p{font-size:14px;line-height:1.68;color:#747870;margin:0}
.footer{padding-top:60px;margin-top:65px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;font-size:12px;color:#a0a199}
.footer strong{color:#6f736b;font-weight:620}
@media(min-width:1000px){.left-col{position:sticky;top:24px;align-self:start}}
@media(max-width:800px){.site{padding-bottom:50px}.masthead{height:74px}.intro{padding:42px 0 54px;gap:24px;grid-template-columns:1fr}.intro-copy{order:1}.image-wrap{order:0}.time-meta{display:flex;flex-wrap:wrap;gap:12px 20px;margin-top:17px;color:#757870;font-size:12px}.time-meta strong{color:#454a44;font-weight:680}
.image-wrap figcaption{display:none}h1{font-size:clamp(42px,7.5vw,67px);margin:20px 0 18px}.hero{border-radius:17px}.recipe-section{grid-template-columns:1fr;gap:54px;padding-top:48px}.step{padding-bottom:28px}.variation-grid{grid-template-columns:1fr}.variations{margin-top:60px;padding-top:44px}.footer{margin-top:55px}}
@media(max-width:420px){.intro{padding-top:25px}.hero{border-radius:13px}h1{font-size:46px}.summary{font-size:16px}.variation{padding:23px}.step{gap:14px;grid-template-columns:39px 1fr}.step-number{width:37px;height:37px}.step:not(:last-child):after{left:18px;top:42px}.step p{font-size:15px}}
@media print{body{background:#fff}.site{max-width:none;padding:0 10mm}.masthead{height:45px}.print,.time-meta{display:flex;flex-wrap:wrap;gap:12px 20px;margin-top:17px;color:#757870;font-size:12px}.time-meta strong{color:#454a44;font-weight:680}
.image-wrap figcaption{display:none}.intro{padding:15px 0 25px;grid-template-columns:1fr 210px;gap:25px}h1{font-size:35px;margin:12px 0}.summary{font-size:12px}.hero{border-radius:5px}.recipe-section{padding-top:25px;gap:35px;grid-template-columns:.8fr 1.2fr}.section-title{font-size:21px}.section-sub{margin:5px 0 15px}.ingredient-group{list-style:none;margin:15px 0 0;color:#865c42;font-size:12px;font-weight:720;text-transform:uppercase;letter-spacing:.12em}
.ingredient label{padding:6px 0;font-size:11px;gap:9px}.ingredient input{width:13px;height:13px;flex-basis:13px}.step{padding-bottom:12px;grid-template-columns:25px 1fr;gap:9px}.step-number{width:25px;height:25px;font-size:10px}.step:not(:last-child):after{left:12px;top:30px}.step p{font-size:11px}.variations{margin-top:30px;padding-top:20px}.variation-grid{margin-top:15px}.variation{padding:14px;min-height:0}.variation p{font-size:10px}.footer{margin-top:25px;padding-top:10px}*{box-shadow:none!important}}
</style>
<script type="application/ld+json">{{JSON_LD}}</script>
</head>
<body>
<main class="site">
  <div class="masthead">
    <div class="brand" aria-label="Recipe Library">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      {{SITE_NAME}}
    </div>
    <button class="print" type="button" onclick="window.print()" aria-label="Print recipe">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8V3h10v5M6 17H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M7 14h10v7H7z" /></svg>
      Print recipe
    </button>
  </div>
  <header class="intro {{INTRO_CLASS}}">
    <div class="intro-copy">
      <div class="kicker">{{CATEGORY}}</div>
      <h1>{{TITLE}}</h1>
      {{SUMMARY_BLOCK}}
      {{YIELD_BLOCK}}
      {{TIME_BLOCK}}
    </div>
    {{HERO_BLOCK}}
  </header>
  <div class="recipe-section">
    <section class="left-col" aria-labelledby="ingredients-heading">
      <h2 class="section-title" id="ingredients-heading">Ingredients</h2>
      <p class="section-sub">Everything you need, in one place.</p>
      <ul class="ingredients">{{INGREDIENT_ITEMS}}</ul>
    </section>
    <section aria-labelledby="instructions-heading">
      <h2 class="section-title" id="instructions-heading">Instructions</h2>
      <p class="section-sub">{{STEPS_SUBTITLE}}</p>
      <ol class="step-list">{{STEP_ITEMS}}</ol>
    </section>
  </div>
  {{VARIATIONS_BLOCK}}
  <footer class="footer"><span><strong>{{SITE_NAME}}</strong> · Made with RecipeKit</span></footer>
</main>
</body>
</html>
